# giode.toml configures how the giode CLI builds EasySend.
# Reference: https://github.com/xmhrnx/giode-cli#giodetoml

[app]
name = "EasySend"
id = "app.easysend"
version = "1.0.0"
build = 1
icon = "assets/icon.png"
package = "."
platforms = ["windows", "macos", "linux", "android", "ios"]
publisher = "EasySend"
description = "Send files, folders and text nearby, over the internet, or to any browser."
website = "https://github.com/xmhrnx/easysend"
splash_color = "#0A0A0B"        # launch screen (dark mode)
splash_color_light = "#F4F4F6"  # launch screen (light mode)
share_target = true             # in the phone share sheet for files and text
schemes = ["wormhole-transfer"]  # internet codes scanned as QR codes open EasySend

[android]
min_sdk = 24
permissions = [
  "network",
  "networkstate",
  "notifications",
  "foreground_service",
  "android.permission.ACCESS_WIFI_STATE",
]
keep_alive = true            # App.KeepAlive keeps transfers running in the background
icon_foreground = "assets/android-foreground.png"
icon_background = "assets/android-background.png"
icon_monochrome = "assets/android-monochrome.png"
# keystore = "release.keystore"   # created by giode keystore; signs giode build -release

[ios]
min_os = 15

[ios.usage]
local_network = "EasySend finds nearby devices and exchanges files with them on your network."

[ios.plist]
NSBonjourServices = ["_localsend._tcp"]
UIFileSharingEnabled = true
LSSupportsOpeningDocumentsInPlace = true
ITSAppUsesNonExemptEncryption = false

[macos]
min_os = 11

[macos.usage]
local_network = "EasySend finds nearby devices and exchanges files with them on your network."

[windows]
arch = "amd64"

[windows.installer]
desktop_shortcut = true
firewall = true              # let phones and browsers on the local network reach EasySend
firewall_public = true       # also on networks Windows marks Public (many home Wi-Fi)

[windows.msix]                    # Microsoft Store: Partner Center → EasySend → Product identity
identity_name = "MehranZahir.EasySend"
publisher = "CN=B40E8F57-A7E0-40BB-8E74-5D051D0B578B"
publisher_display_name = "Mehran Zahir"
startup_task = true

[linux]
maintainer = "Mehran <xmhrnx@users.noreply.github.com>"   # .deb/.rpm metadata
categories = ["Network", "FileTransfer", "Utility"]
description = "EasySend sends files, folders and text between devices: nearby with discovery (compatible with LocalSend), anywhere over the internet with a short code (compatible with Magic Wormhole), and to anyone with a browser through a link or QR code."
license = "Apache-2.0"
# Flatpak sandbox: window and GPU, the network (nearby transfers, links,
# internet codes), received files in Downloads, the tray, notifications,
# and start at login.
flatpak_permissions = [
  "--share=ipc",
  "--socket=wayland",
  "--socket=fallback-x11",
  "--device=dri",
  "--share=network",
  "--filesystem=xdg-download",
  "--talk-name=org.kde.StatusNotifierWatcher",
  "--talk-name=org.freedesktop.Notifications",
  "--filesystem=xdg-config/autostart:create",
]

[[context_actions]]
id = "send"
label = "Send with EasySend"
files = true
folders = true

# GitHub Actions (giode ci writes .github/workflows/release.yml from this;
# rerun `giode ci -f` after changing it). Builds only when a GitHub release
# is published, and attaches the packages to that release.
[ci]
trigger = "release"
test = "go vet ./... && go test ./..."
dispatch = false
