{{define "drop"}}{{template "head" "Send files"}}{{template "brand" .Device}}
<div class="card">
<h1>Send to {{.Device}}</h1><p class="sub">Files go straight to this device over your network.</p>
<label id="zone" class="zone"><input id="pick" type="file" multiple hidden>
<div class="orb" style="color:var(--brand)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V7m0 0-5 5m5-5 5 5M5 3h14"/></svg></div>
<b>Tap to choose files</b><span>or drop them here</span></label>
<div class="list" id="list"></div>
<div style="margin-top:22px"><textarea id="msg" rows="3" placeholder="…or type a message"></textarea>
<div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn small" id="sendText">Send message</button></div></div>
<p class="err" id="err"></p>
</div>
<style>.zone{display:flex;flex-direction:column;align-items:center;gap:6px;padding:38px 16px;border-radius:20px;border:1.5px dashed rgba(200,169,107,.35);background:rgba(200,169,107,.03);cursor:pointer;text-align:center;transition:.2s}
.zone.over{border-color:var(--brand2);background:rgba(200,169,107,.08);transform:scale(1.01)}.zone span{color:var(--muted);font-size:14px}
.orb{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--orb);border:1px solid var(--ring);margin-bottom:8px}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--grad);transition:width .2s}
.done .bar i{background:var(--ok)}</style>
<script>
const base='/r/{{.Token}}',zone=document.getElementById('zone'),list=document.getElementById('list'),err=document.getElementById('err');
function fmt(n){const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return(i?n.toFixed(1):n)+' '+u[i]}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function send(files){if(!files.length)return;err.textContent='';
 const r=await fetch(base+'/begin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({files:[...files].map(f=>({name:f.name,size:f.size}))})});
 if(!r.ok){err.textContent='This link is no longer accepting files.';return}
 const {batch}=await r.json();
 const rows=[...files].map(f=>{const d=document.createElement('div');d.className='row';d.innerHTML='<div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></div><div class="meta"><div class="name">'+esc(f.name)+'</div><div class="size">'+fmt(f.size)+'</div><div class="bar"><i></i></div></div>';list.prepend(d);return d});
 for(let i=0;i<files.length;i++){await new Promise(res=>{const x=new XMLHttpRequest();x.open('POST',base+'/file?batch='+batch+'&i='+i);
  x.upload.onprogress=e=>{if(e.lengthComputable)rows[i].querySelector('.bar i').style.width=(e.loaded/e.total*100)+'%'};
  x.onload=()=>{if(x.status==200){rows[i].classList.add('done');rows[i].querySelector('.bar i').style.width='100%';rows[i].querySelector('.size').textContent=fmt(files[i].size)+' · Sent ✓'}else err.textContent='Upload failed.';res()};
  x.onerror=()=>{err.textContent='Connection lost.';res()};x.send(files[i])})}}
document.getElementById('pick').onchange=e=>{const f=[...e.target.files];e.target.value='';send(f)};
['dragenter','dragover'].forEach(t=>zone.addEventListener(t,e=>{e.preventDefault();zone.classList.add('over')}));
['dragleave','drop'].forEach(t=>zone.addEventListener(t,e=>{e.preventDefault();zone.classList.remove('over')}));
zone.addEventListener('drop',e=>send([...e.dataTransfer.files]));
document.getElementById('sendText').onclick=async()=>{const m=document.getElementById('msg');if(!m.value.trim())return;
 const r=await fetch(base+'/text',{method:'POST',body:m.value});if(r.ok){m.value='';m.placeholder='Message sent ✓'}else err.textContent='Could not send the message.'};
</script>
{{template "foot"}}{{end}}
