<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A6BFF"/>
      <stop offset="0.5" stop-color="#5B5CF6"/>
      <stop offset="1" stop-color="#1FC8EA"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4ECFF"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#1E1B4B" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="230" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="230" fill="url(#shine)"/>
  <!-- signal arcs: nearby + internet -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M250 640 A 190 190 0 0 0 384 774" stroke-width="34" stroke-opacity="0.55"/>
    <path d="M170 650 A 270 270 0 0 0 374 854" stroke-width="34" stroke-opacity="0.3"/>
  </g>
  <!-- paper plane -->
  <g filter="url(#shadow)">
    <path d="M232 488 L760 250 C786 238 812 262 800 288 L566 812 C554 838 516 836 508 808 L452 600 Z" fill="url(#plane)"/>
    <path d="M452 600 L800 288 L522 796 Z" fill="url(#fold)" opacity="0.55"/>
    <path d="M232 488 L452 600 L800 288 Z" fill="#FFFFFF"/>
  </g>
</svg>
